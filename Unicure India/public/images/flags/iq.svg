<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="100%">
  <rect width="450" height="100" fill="#ce1126"/>
  <rect y="100" width="450" height="100" fill="#ffffff"/>
  <rect y="200" width="450" height="100" fill="#000000"/>
  <!-- Kufic script: Allahu Akbar in green -->
  <g fill="#007a3d" transform="translate(145, 125)">
    <!-- Allah -->
    <rect x="0" y="0" width="10" height="48"/>
    <rect x="0" y="38" width="50" height="10"/>
    <rect x="20" y="10" width="10" height="38"/>
    <rect x="40" y="10" width="10" height="38"/>
    <rect x="20" y="10" width="30" height="10"/>
    <!-- Akbar -->
    <rect x="80" y="0" width="10" height="48"/>
    <rect x="80" y="38" width="75" height="10"/>
    <rect x="100" y="15" width="10" height="33"/>
    <rect x="120" y="15" width="10" height="33"/>
    <rect x="145" y="15" width="10" height="33"/>
    <rect x="100" y="15" width="55" height="10"/>
  </g>
</svg>
