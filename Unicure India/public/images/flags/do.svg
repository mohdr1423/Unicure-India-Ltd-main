<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <rect width="500" height="300" fill="#ffffff"/>
  <!-- Top Left: Blue -->
  <rect x="0" y="0" width="220" height="120" fill="#002b66"/>
  <!-- Top Right: Red -->
  <rect x="280" y="0" width="220" height="120" fill="#ce1126"/>
  <!-- Bottom Left: Red -->
  <rect x="0" y="180" width="220" height="120" fill="#ce1126"/>
  <!-- Bottom Right: Blue -->
  <rect x="280" y="180" width="220" height="120" fill="#002b66"/>
  <!-- Coat of arms badge in center -->
  <g transform="translate(250,150) scale(0.55)">
    <path d="M-30,-30 L30,-30 L30,0 Q30,30 0,40 Q-30,30 -30,0 Z" fill="#002b66" stroke="#ce1126" stroke-width="4"/>
    <path d="M-22,-22 L22,-22 L22,0 Q22,22 0,30 Q-22,22 -22,0 Z" fill="#ffffff"/>
    <path d="M-15,-15 L15,-15 L15,0 Q15,15 0,22 Q-15,15 -15,0 Z" fill="#ce1126"/>
    <path d="M-8,-8 L8,-8 L8,0 Q8,8 0,14 Q-8,8 -8,0 Z" fill="#007a3d"/>
    <rect x="-3" y="-12" width="6" height="24" fill="#ffffff"/>
    <rect x="-12" y="-3" width="24" height="6" fill="#ffffff"/>
    <!-- Laurel and palm branches -->
    <path d="M-38,10 Q-42,-20 -20,-35" stroke="#007a3d" stroke-width="4" fill="none"/>
    <path d="M38,10 Q42,-20 20,-35" stroke="#007a3d" stroke-width="4" fill="none"/>
    <path d="M-25,-36 Q0,-42 25,-36" stroke="#002b66" stroke-width="3" fill="none"/>
    <path d="M-22,38 Q0,44 22,38" stroke="#ce1126" stroke-width="3" fill="none"/>
  </g>
</svg>
