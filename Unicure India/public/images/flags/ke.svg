<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="100%" height="100%">
  <!-- Black top -->
  <rect width="450" height="90" fill="#000000"/>
  <!-- White top border -->
  <rect y="90" width="450" height="15" fill="#ffffff"/>
  <!-- Red center -->
  <rect y="105" width="450" height="90" fill="#bb0000"/>
  <!-- White bottom border -->
  <rect y="195" width="450" height="15" fill="#ffffff"/>
  <!-- Green bottom -->
  <rect y="210" width="450" height="90" fill="#006600"/>
  
  <!-- Crossed spears -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="60" x2="290" y2="240"/>
    <line x1="290" y1="60" x2="160" y2="240"/>
  </g>
  <!-- Maasai Shield in center -->
  <g transform="translate(225, 150)">
    <!-- Outer shield contour -->
    <path d="M0,-85 C45,-40 45,40 0,85 C-45,40 -45,-40 0,-85 Z" fill="#bb0000" stroke="#000000" stroke-width="3"/>
    <!-- Left black section -->
    <path d="M0,-85 C-25,-40 -25,40 0,85 C-45,40 -45,-40 0,-85 Z" fill="#000000"/>
    <!-- Right black section -->
    <path d="M0,-85 C25,-40 25,40 0,85 C45,40 45,-40 0,-85 Z" fill="#000000"/>
    <!-- White center spear/dots -->
    <ellipse cx="0" cy="0" rx="7" ry="25" fill="#ffffff"/>
    <circle cx="0" cy="-45" r="4" fill="#ffffff"/>
    <circle cx="0" cy="45" r="4" fill="#ffffff"/>
  </g>
</svg>
